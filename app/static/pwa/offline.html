<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <title>Hogar — Sin conexión</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f5f6fa; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           color: #1f2937; text-align: center; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 24px; padding: 32px 24px; max-width: 320px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 14px; color: #6b7280; margin: 0 0 24px; }
    button { background: #4f46e5; color: #fff; border: 0; border-radius: 12px; padding: 12px 24px;
             font-size: 15px; font-weight: 600; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <!-- a "wifi off" icon, inline because nothing else can load offline -->
    <svg width="64" height="64" viewBox="0 0 24 24" fill="#9ca3af" aria-hidden="true">
      <path d="M22.99 9C19.15 5.16 13.8 3.76 8.84 4.78l2.52 2.52c3.47-.17 6.99 1.05 9.63 3.7l2-2zm-4 4c-1.29-1.29-2.84-2.13-4.49-2.56l3.53 3.53.96-.97zM2 3.05 5.07 6.1C3.6 6.82 2.22 7.78 1 9l1.99 2c1.24-1.24 2.67-2.16 4.2-2.77l2.24 2.24C7.81 10.89 6.27 11.73 5 13v.01L6.99 15c1.36-1.36 3.14-2.04 4.92-2.06L18.98 20l1.27-1.26L3.29 1.79 2 3.05zM9 17l3 3 3-3c-1.65-1.66-4.34-1.66-6 0z"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>Revisa tu internet e intenta de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
